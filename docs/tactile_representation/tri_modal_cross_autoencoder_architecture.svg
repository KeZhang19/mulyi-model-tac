<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1350" viewBox="0 0 2400 1350" role="img" aria-labelledby="title desc">
  <title id="title">版本二：Tri-Modal Cross-Attention Autoencoder</title>
  <desc id="desc">RGB、Depth、Marker 三个观测分别编码，进行两层对等三模态交叉注意力，汇聚为共享 latent，并始终解码重建三个模态。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6fbff"/>
      <stop offset="0.5" stop-color="#f4f7ff"/>
      <stop offset="1" stop-color="#f7f2ff"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#275ca8"/>
      <stop offset="0.52" stop-color="#5147b9"/>
      <stop offset="1" stop-color="#7b3faf"/>
    </linearGradient>
    <linearGradient id="latentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7457d8"/>
      <stop offset="1" stop-color="#44309b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#263451" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowWhite" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffffff"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#654dc1"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #182338; }
      .title { font-size: 48px; font-weight: 800; }
      .subtitle { font-size: 23px; fill: #53617a; }
      .stage { font-size: 21px; font-weight: 800; fill: #36425a; letter-spacing: 0.5px; }
      .box-title { font-size: 24px; font-weight: 800; }
      .box-sub { font-size: 18px; fill: #4d5a72; }
      .tiny { font-size: 16px; fill: #617089; }
      .mono { font-family: "DejaVu Sans Mono", monospace; }
      .main-arrow { fill: none; stroke: #475569; stroke-width: 4; marker-end: url(#arrow); }
      .latent-arrow { fill: none; stroke: #654dc1; stroke-width: 5; marker-end: url(#arrowPurple); }
      .white-arrow { fill: none; stroke: #ffffff; stroke-width: 3; marker-end: url(#arrowWhite); }
      .chip { font-size: 17px; font-weight: 700; }
    </style>
  </defs>

  <rect width="2400" height="1350" fill="url(#bg)"/>
  <rect x="28" y="25" width="2344" height="1300" rx="32" fill="#ffffff" fill-opacity="0.61" stroke="#dce4f2" stroke-width="2"/>

  <text x="1200" y="86" class="title" text-anchor="middle">版本二 · Tri-Modal Cross-Attention Autoencoder</text>
  <text x="1200" y="126" class="subtitle" text-anchor="middle">三个观测全部输入 → 对等 Cross-Attention → 共享 latent → 三个模态全部重新解码</text>

  <text x="160" y="188" class="stage" text-anchor="middle">1  三模态输入</text>
  <text x="510" y="188" class="stage" text-anchor="middle">2  独立编码</text>
  <text x="1060" y="188" class="stage" text-anchor="middle">3  三路 Cross-Attention ×2</text>
  <text x="1575" y="188" class="stage" text-anchor="middle">4  Shared Latent</text>
  <text x="1910" y="188" class="stage" text-anchor="middle">5  全模态解码</text>
  <text x="2250" y="188" class="stage" text-anchor="middle">6  重建输出</text>

  <!-- Input cards -->
  <g filter="url(#shadow)">
    <rect x="55" y="260" width="255" height="150" rx="22" fill="#fff1ee" stroke="#e66b5f" stroke-width="3"/>
    <rect x="55" y="510" width="255" height="150" rx="22" fill="#edf5ff" stroke="#4d8ed9" stroke-width="3"/>
    <rect x="55" y="760" width="255" height="165" rx="22" fill="#eff9ee" stroke="#62a660" stroke-width="3"/>
  </g>
  <circle cx="92" cy="300" r="12" fill="#df574d"/><text x="118" y="309" class="box-title">RGB</text>
  <text x="182" y="352" class="box-sub mono" text-anchor="middle">[B, 3, 240, 320]</text>
  <text x="182" y="384" class="tiny" text-anchor="middle">当前视触觉图像</text>

  <circle cx="92" cy="550" r="12" fill="#3d82cc"/><text x="118" y="559" class="box-title">Depth</text>
  <text x="182" y="602" class="box-sub mono" text-anchor="middle">[B, 1, 240, 320]</text>
  <text x="182" y="634" class="tiny" text-anchor="middle">当前接触深度</text>

  <circle cx="92" cy="800" r="12" fill="#55a255"/><text x="118" y="809" class="box-title">Marker</text>
  <text x="182" y="852" class="box-sub mono" text-anchor="middle">[B, 100, 5]</text>
  <text x="182" y="884" class="tiny" text-anchor="middle">x0, y0, dx, dy, valid</text>

  <!-- Encoders -->
  <g filter="url(#shadow)">
    <rect x="375" y="260" width="280" height="150" rx="22" fill="#fff8f7" stroke="#e66b5f" stroke-width="3"/>
    <rect x="375" y="510" width="280" height="150" rx="22" fill="#f4f8ff" stroke="#4d8ed9" stroke-width="3"/>
    <rect x="375" y="760" width="280" height="165" rx="22" fill="#f4fbf3" stroke="#62a660" stroke-width="3"/>
  </g>
  <text x="515" y="307" class="box-title" text-anchor="middle">RGB Image Encoder</text>
  <text x="515" y="345" class="box-sub" text-anchor="middle">Residual CNN · stride 16</text>
  <text x="515" y="379" class="tiny mono" text-anchor="middle">R tokens: 300 × 256</text>

  <text x="515" y="557" class="box-title" text-anchor="middle">Depth Image Encoder</text>
  <text x="515" y="595" class="box-sub" text-anchor="middle">Residual CNN · zero-safe</text>
  <text x="515" y="629" class="tiny mono" text-anchor="middle">D tokens: 300 × 256</text>

  <text x="515" y="803" class="box-title" text-anchor="middle">Marker Encoder</text>
  <text x="515" y="840" class="box-sub" text-anchor="middle">MLP + Transformer ×2</text>
  <text x="515" y="870" class="box-sub" text-anchor="middle">Summary Attention</text>
  <text x="515" y="902" class="tiny mono" text-anchor="middle">M tokens: 4 × 256</text>

  <!-- Cross attention block -->
  <g filter="url(#shadow)">
    <rect x="735" y="225" width="650" height="745" rx="30" fill="url(#crossGrad)"/>
  </g>
  <text x="1060" y="274" font-size="29" font-weight="800" fill="#ffffff" text-anchor="middle">Peer-Summary Cross-Attention</text>
  <text x="1060" y="308" font-size="18" fill="#e9efff" text-anchor="middle">每个模态保留自己的 token，同时查询另外两个模态的摘要</text>

  <!-- R stream -->
  <rect x="780" y="345" width="560" height="142" rx="20" fill="#ffffff" fill-opacity="0.15" stroke="#ffd3cf" stroke-width="2"/>
  <rect x="805" y="375" width="110" height="78" rx="16" fill="#fff0ed"/>
  <text x="860" y="406" class="chip" text-anchor="middle" fill="#bf3e35">R tokens</text>
  <text x="860" y="434" class="tiny mono" text-anchor="middle">300×256</text>
  <rect x="970" y="364" width="315" height="98" rx="17" fill="#ffffff" fill-opacity="0.92"/>
  <text x="1127" y="399" class="chip" text-anchor="middle">RGB queries peer summaries</text>
  <text x="1127" y="431" class="tiny mono" text-anchor="middle">Q=R · KV=[summary(D), summary(M)]</text>
  <path class="white-arrow" d="M915 414 H970"/>

  <!-- D stream -->
  <rect x="780" y="520" width="560" height="142" rx="20" fill="#ffffff" fill-opacity="0.15" stroke="#cfe6ff" stroke-width="2"/>
  <rect x="805" y="550" width="110" height="78" rx="16" fill="#eaf4ff"/>
  <text x="860" y="581" class="chip" text-anchor="middle" fill="#2d70ba">D tokens</text>
  <text x="860" y="609" class="tiny mono" text-anchor="middle">300×256</text>
  <rect x="970" y="539" width="315" height="98" rx="17" fill="#ffffff" fill-opacity="0.92"/>
  <text x="1127" y="574" class="chip" text-anchor="middle">Depth queries peer summaries</text>
  <text x="1127" y="606" class="tiny mono" text-anchor="middle">Q=D · KV=[summary(R), summary(M)]</text>
  <path class="white-arrow" d="M915 589 H970"/>

  <!-- M stream -->
  <rect x="780" y="695" width="560" height="142" rx="20" fill="#ffffff" fill-opacity="0.15" stroke="#d8f2d5" stroke-width="2"/>
  <rect x="805" y="725" width="110" height="78" rx="16" fill="#edf9ec"/>
  <text x="860" y="756" class="chip" text-anchor="middle" fill="#3b873b">M tokens</text>
  <text x="860" y="784" class="tiny mono" text-anchor="middle">4×256</text>
  <rect x="970" y="714" width="315" height="98" rx="17" fill="#ffffff" fill-opacity="0.92"/>
  <text x="1127" y="749" class="chip" text-anchor="middle">Marker queries peer summaries</text>
  <text x="1127" y="781" class="tiny mono" text-anchor="middle">Q=M · KV=[summary(R), summary(D)]</text>
  <path class="white-arrow" d="M915 764 H970"/>

  <rect x="860" y="875" width="400" height="62" rx="31" fill="#ffffff" fill-opacity="0.18" stroke="#ddd7ff" stroke-width="2"/>
  <text x="1060" y="914" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">Multi-Head Attention + FFN · 重复 2 层</text>

  <!-- Modality pooling + latent -->
  <g filter="url(#shadow)">
    <rect x="1435" y="275" width="285" height="575" rx="26" fill="#f0edff" stroke="#7962cf" stroke-width="3"/>
  </g>
  <text x="1577" y="320" class="box-title" text-anchor="middle">Modality Pooling</text>
  <text x="1577" y="352" class="tiny" text-anchor="middle">对 crossed tokens 分别 masked mean</text>

  <rect x="1473" y="395" width="209" height="74" rx="18" fill="#fff3f0" stroke="#e66b5f"/>
  <text x="1577" y="426" class="chip" text-anchor="middle">hR</text>
  <text x="1577" y="452" class="tiny mono" text-anchor="middle">[B,256]</text>
  <rect x="1473" y="500" width="209" height="74" rx="18" fill="#edf5ff" stroke="#4d8ed9"/>
  <text x="1577" y="531" class="chip" text-anchor="middle">hD</text>
  <text x="1577" y="557" class="tiny mono" text-anchor="middle">[B,256]</text>
  <rect x="1473" y="605" width="209" height="74" rx="18" fill="#eff9ee" stroke="#62a660"/>
  <text x="1577" y="636" class="chip" text-anchor="middle">hM</text>
  <text x="1577" y="662" class="tiny mono" text-anchor="middle">[B,256]</text>

  <text x="1577" y="725" class="chip mono" text-anchor="middle">concat → [B,768]</text>
  <rect x="1473" y="755" width="209" height="65" rx="18" fill="url(#latentGrad)"/>
  <text x="1577" y="783" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">Linear + GELU + LN</text>
  <text x="1577" y="808" font-size="16" fill="#eeeaff" text-anchor="middle">→ h [B,256]</text>

  <!-- Decoders -->
  <g filter="url(#shadow)">
    <rect x="1780" y="250" width="300" height="180" rx="22" fill="#fff3f0" stroke="#e66b5f" stroke-width="3"/>
    <rect x="1780" y="500" width="300" height="180" rx="22" fill="#eef6ff" stroke="#4d8ed9" stroke-width="3"/>
    <rect x="1780" y="750" width="300" height="195" rx="22" fill="#eff9ee" stroke="#62a660" stroke-width="3"/>
  </g>
  <text x="1930" y="294" class="box-title" text-anchor="middle">RGB Decoder</text>
  <text x="1930" y="332" class="box-sub" text-anchor="middle">共享 h</text>
  <text x="1930" y="362" class="box-sub" text-anchor="middle">+ crossed RGB spatial tokens</text>
  <text x="1930" y="398" class="tiny" text-anchor="middle">每次都重新生成 RGB</text>

  <text x="1930" y="544" class="box-title" text-anchor="middle">Depth Decoder</text>
  <text x="1930" y="582" class="box-sub" text-anchor="middle">共享 h</text>
  <text x="1930" y="612" class="box-sub" text-anchor="middle">+ crossed Depth spatial tokens</text>
  <text x="1930" y="648" class="tiny" text-anchor="middle">每次都重新生成 Depth</text>

  <text x="1930" y="794" class="box-title" text-anchor="middle">Marker Motion Decoder</text>
  <text x="1930" y="832" class="box-sub" text-anchor="middle">共享 h + 固定 (x0,y0)</text>
  <text x="1930" y="862" class="box-sub" text-anchor="middle">+ crossed RGB/Depth tokens</text>
  <text x="1930" y="902" class="tiny" text-anchor="middle">每次都重新生成 dx/dy</text>

  <!-- Outputs -->
  <g filter="url(#shadow)">
    <rect x="2160" y="280" width="180" height="120" rx="22" fill="#ffffff" stroke="#e66b5f" stroke-width="3"/>
    <rect x="2160" y="530" width="180" height="120" rx="22" fill="#ffffff" stroke="#4d8ed9" stroke-width="3"/>
    <rect x="2160" y="780" width="180" height="135" rx="22" fill="#ffffff" stroke="#62a660" stroke-width="3"/>
  </g>
  <text x="2250" y="327" class="box-title" text-anchor="middle">RGB_hat</text>
  <text x="2250" y="366" class="tiny mono" text-anchor="middle">[B,3,240,320]</text>
  <text x="2250" y="577" class="box-title" text-anchor="middle">Depth_hat</text>
  <text x="2250" y="616" class="tiny mono" text-anchor="middle">[B,1,240,320]</text>
  <text x="2250" y="827" class="box-title" text-anchor="middle">Marker_hat</text>
  <text x="2250" y="864" class="tiny mono" text-anchor="middle">dx/dy [B,100,2]</text>
  <text x="2250" y="894" class="tiny" text-anchor="middle">只预测动态量</text>

  <!-- Main arrows -->
  <path class="main-arrow" d="M310 335 H375"/>
  <path class="main-arrow" d="M310 585 H375"/>
  <path class="main-arrow" d="M310 842 H375"/>
  <path class="main-arrow" d="M655 335 H735"/>
  <path class="main-arrow" d="M655 585 H735"/>
  <path class="main-arrow" d="M655 842 H735"/>
  <path class="main-arrow" d="M1385 415 H1435"/>
  <path class="main-arrow" d="M1385 590 H1435"/>
  <path class="main-arrow" d="M1385 765 H1435"/>
  <path class="latent-arrow" d="M1720 787 H1750 V340 H1780"/>
  <path class="latent-arrow" d="M1750 590 H1780"/>
  <path class="latent-arrow" d="M1750 787 V847 H1780"/>
  <path class="main-arrow" d="M2080 340 H2160"/>
  <path class="main-arrow" d="M2080 590 H2160"/>
  <path class="main-arrow" d="M2080 847 H2160"/>

  <!-- Latent to downstream task -->
  <path class="latent-arrow" d="M1577 850 V1015"/>
  <g filter="url(#shadow)">
    <rect x="1370" y="1015" width="415" height="105" rx="24" fill="#f0ecff" stroke="#654dc1" stroke-width="3"/>
  </g>
  <text x="1577" y="1056" class="box-title" text-anchor="middle">Policy / Downstream Task</text>
  <text x="1577" y="1092" class="box-sub" text-anchor="middle">可使用共享 latent h，但尚需任务评测</text>

  <!-- Important behavior note -->
  <rect x="245" y="1015" width="910" height="105" rx="24" fill="#fff7dc" stroke="#d8a83d" stroke-width="3"/>
  <text x="700" y="1055" class="box-title" text-anchor="middle">没有 Reliability Head / Restore Gate / 原始观测旁路</text>
  <text x="700" y="1092" class="box-sub" text-anchor="middle">输入即使完全正常，也仍会经过 Encoder → Cross → Decoder，因此输出存在轻微重建漂移</text>

  <rect x="350" y="1190" width="1700" height="85" rx="22" fill="#eef2f8" stroke="#c8d2e2" stroke-width="2"/>
  <text x="1200" y="1225" class="box-sub" text-anchor="middle">当前检查点：epoch 348 · d_model 256 · 8 heads · cross layers 2 · summary tokens 4 · 参数量 21.58M</text>
  <text x="1200" y="1258" class="tiny" text-anchor="middle">核心特性：必须同时输入 RGB/Depth/Marker；三路 token 对等交换信息；三个模态始终全部重建；Marker 仅输出 dx/dy</text>
</svg>
