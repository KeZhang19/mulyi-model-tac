# 单位：mm；Tag系就是默认URDF的唯一支架世界系。
坐标系:
  标定台: 设备显示的 XYZ
  安装孔: mount_hole_1（孔中心最底面），轴向与Tag一致
  Tag: tag_center（Tag槽底中心）

标定孔_标定台系: {x: -282.5, y: 162.5}
孔距: 25.0
安装孔相对标定孔_孔数: {x: 2, y: -1}
支座相对原安装绕Z旋转_度: 180  # 已包含在下方轴向关系中，换算时不要重复旋转

安装孔坐标:
  标定台系: {x: -232.5, y: 137.5, z: -343.7}  # XY由孔距推算；Z=-308.2-35.5，非孔底面独立实测
  Tag系:    {x: -152.0, y: 35.0, z: -35.5}  # URDF mount_hole_1；模型(18,235,0)减Tag原点(170,200,35.5)

Tag原点_标定台系: {x: -267.5, y: -14.5, z: -308.2}  # 用户确认：-308.2是Tag原点的设备读数

轴向关系:
  标定台X正向: TagY正向
  标定台Y正向: TagX负向
  标定台Z正向: TagZ正向

已知高度:
  平台平面_TagZ_模型值: 0.5
  平台平面_标定台Z_当前推算: -307.7
  平台平面_标定台Z_历史实测: -308.5605  # 与新Tag实测不一致，不用于当前换算

# M=标定台坐标，T=Tag坐标；公式为说明，不会自动计算。
# XY锚点为mount_hole_1：T.x=-(M.y-137.5)-152；T.y=(M.x+232.5)+35。
# Z锚点为用户确认的Tag原点高度-308.2；孔底面比Tag低35.5mm。
换算公式:
  标定台到Tag:
    x: "T.x = -(M.y + 14.5)"
    y: "T.y = M.x + 267.5"
    z: "T.z = M.z + 308.2"
  Tag到标定台:
    x: "M.x = T.y - 267.5"
    y: "M.y = -T.x - 14.5"
    z: "M.z = T.z - 308.2"
