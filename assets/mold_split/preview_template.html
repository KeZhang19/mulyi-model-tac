<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>上下模 · 法向开合预览</title>
<style>
body{margin:0;background:#101821;color:#e4edf5;font:16px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:24px;margin:0 0 10px}p{color:#b5c3d0;line-height:1.6}canvas{width:100%;height:66vh;min-height:320px;display:block;background:#172431;border:1px solid #344658;border-radius:12px;touch-action:none}label{display:flex;align-items:center;gap:14px;margin:20px 0}input{flex:1}button{border:1px solid #526a81;color:#e4edf5;background:#233548;border-radius:6px;padding:9px 15px;cursor:pointer}small{color:#a7b8c8}output{min-width:75px}.legend{color:#6fb0ee}
</style>
<main><h1>上下模 · 沿贴合面法向开合</h1><p>蓝色为上模，灰色为下模。拖动旋转视角，滚轮缩放；滑块 0 mm 保持原 CAD 闭合位置。</p>
<canvas id="view"></canvas><label>开模距离 <input id="q" type="range" min="0" step="0.5" value="80"><output id="value"></output></label>
<button id="close">闭合</button> <button id="open">打开</button> <button id="reset">重置视角</button>
<p id="axis"></p><small>几何与运动预览；颜色仅用于区分部件。未归属的微小实体和辅助曲面保存在参考 CAD 中。此预览不运行接触或动力学仿真。</small></main>
<script>
'use strict';
const data=__MOLD_DATA__;
const canvas=document.getElementById('view'),gl=canvas.getContext('webgl');
if(!gl)throw new Error('浏览器不支持 WebGL，请使用支持 WebGL 的桌面浏览器。');
function shader(type,code){const s=gl.createShader(type);gl.shaderSource(s,code);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
const program=gl.createProgram();
gl.attachShader(program,shader(gl.VERTEX_SHADER,`attribute vec3 pos;attribute vec3 normal;uniform mat4 matrix;uniform vec3 shift;varying vec3 n;void main(){gl_Position=matrix*vec4(pos+shift,1.);n=normal;}`));
gl.attachShader(program,shader(gl.FRAGMENT_SHADER,`precision mediump float;varying vec3 n;uniform vec3 color;void main(){vec3 normal=normalize(n);float a=max(dot(normal,normalize(vec3(-.4,-.5,1.))),0.);float b=max(dot(normal,normalize(vec3(.7,.6,-.5))),0.);gl_FragColor=vec4(color*(.36+.5*a+.2*b),1.);}`));
gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
const pos=gl.getAttribLocation(program,'pos'),normal=gl.getAttribLocation(program,'normal'),matrix=gl.getUniformLocation(program,'matrix'),shift=gl.getUniformLocation(program,'shift'),color=gl.getUniformLocation(program,'color');
const parts=Object.entries(data.meshes).map(([name,encoded])=>{const bytes=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));const values=new Float32Array(bytes.buffer);const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,values,gl.STATIC_DRAW);return{name,buffer,count:values.length/6};});
gl.enable(gl.DEPTH_TEST);gl.clearColor(.09,.14,.19,1);
const q=document.getElementById('q');q.max=data.stroke_mm;q.value=Math.min(80,data.stroke_mm);
document.getElementById('axis').textContent='开模轴（原 CAD 坐标）：'+data.axis.map(v=>v.toFixed(8)).join(', ')+'；行程上限为可调整的建模参数。';
let yaw=-.7,pitch=.75,distance=.62,drag=null;
function dot(a,b){return a.reduce((s,v,i)=>s+v*b[i],0);}
function cross(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}
function norm(a){return a.map(v=>v/Math.hypot(...a));}
function multiply(a,b){let r=new Float32Array(16);for(let j=0;j<4;j++)for(let i=0;i<4;i++)for(let k=0;k<4;k++)r[j*4+i]+=a[k*4+i]*b[j*4+k];return r;}
function draw(){
 const dpr=Math.min(devicePixelRatio||1,2);canvas.width=canvas.clientWidth*dpr;canvas.height=canvas.clientHeight*dpr;gl.viewport(0,0,canvas.width,canvas.height);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
 const opening=Number(q.value)/1000;document.getElementById('value').textContent=Number(q.value).toFixed(1)+' mm';
 const target=[.035,.09,opening*.5],z=[Math.cos(pitch)*Math.cos(yaw),Math.cos(pitch)*Math.sin(yaw),Math.sin(pitch)],x=norm(cross([0,0,1],z)),y=cross(z,x),eye=target.map((v,i)=>v+distance*z[i]);
 const view=new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,eye),-dot(y,eye),-dot(z,eye),1]);
 const f=1/Math.tan(.65/2),aspect=canvas.width/canvas.height,near=.001,far=10;
 const projection=new Float32Array([f/aspect,0,0,0,0,f,0,0,0,0,(far+near)/(near-far),-1,0,0,2*far*near/(near-far),0]);gl.uniformMatrix4fv(matrix,false,multiply(projection,view));
 for(const part of parts){const upper=part.name==='upper_mold';gl.bindBuffer(gl.ARRAY_BUFFER,part.buffer);gl.enableVertexAttribArray(pos);gl.vertexAttribPointer(pos,3,gl.FLOAT,false,24,0);gl.enableVertexAttribArray(normal);gl.vertexAttribPointer(normal,3,gl.FLOAT,false,24,12);gl.uniform3fv(shift,upper?data.axis.map(v=>v*opening):[0,0,0]);gl.uniform3fv(color,upper?[.28,.55,.82]:[.65,.68,.72]);gl.drawArrays(gl.TRIANGLES,0,part.count);}
}
q.oninput=draw;document.getElementById('close').onclick=()=>{q.value=0;draw();};document.getElementById('open').onclick=()=>{q.value=data.stroke_mm;draw();};document.getElementById('reset').onclick=()=>{yaw=-.7;pitch=.75;distance=.62;draw();};
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;canvas.onpointermove=e=>{if(!drag)return;yaw-=(e.clientX-drag[0])*.007;pitch=Math.max(-1.5,Math.min(1.5,pitch+(e.clientY-drag[1])*.007));drag=[e.clientX,e.clientY];draw();};canvas.onwheel=e=>{e.preventDefault();distance=Math.max(.15,Math.min(2,distance*Math.exp(e.deltaY*.001)));draw();};window.onresize=draw;draw();
</script></html>
